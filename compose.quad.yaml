# Use with compose.yaml. PARSE_WORKERS is the process count on every GPU.
services:
  # Reserve one priority-only process on each of the first two GPUs.
  mineru-worker:
    environment:
      PRIORITY_WORKERS: 1

  mineru-worker-b:
    extends:
      file: compose.yaml
      service: mineru-worker
    # Declare dependencies explicitly for Compose versions that omit them in extends.
    depends_on:
      mineru-api:
        condition: service_healthy
      mineru-vlm-gateway:
        condition: service_healthy
    environment:
      PRIORITY_WORKERS: 1
    deploy:
      resources:
        reservations:
          devices: !override
            - driver: nvidia
              device_ids: ["${GPU_ID_B:-1}"]
              capabilities: [gpu]

  mineru-vlm-b:
    extends:
      file: compose.yaml
      service: mineru-vlm
    volumes:
      - vlm-cache-b:/root/.cache/vllm
    deploy:
      resources:
        reservations:
          devices: !override
            - driver: nvidia
              device_ids: ["${GPU_ID_B:-1}"]
              capabilities: [gpu]

  mineru-worker-c:
    extends:
      file: compose.yaml
      service: mineru-worker
    # Declare dependencies explicitly for Compose versions that omit them in extends.
    depends_on:
      mineru-api:
        condition: service_healthy
      mineru-vlm-gateway:
        condition: service_healthy
    environment:
      PRIORITY_WORKERS: 0
    deploy:
      resources:
        reservations:
          devices: !override
            - driver: nvidia
              device_ids: ["${GPU_ID_C:-2}"]
              capabilities: [gpu]

  mineru-vlm-c:
    extends:
      file: compose.yaml
      service: mineru-vlm
    volumes:
      - vlm-cache-c:/root/.cache/vllm
    deploy:
      resources:
        reservations:
          devices: !override
            - driver: nvidia
              device_ids: ["${GPU_ID_C:-2}"]
              capabilities: [gpu]

  mineru-worker-d:
    extends:
      file: compose.yaml
      service: mineru-worker
    # Declare dependencies explicitly for Compose versions that omit them in extends.
    depends_on:
      mineru-api:
        condition: service_healthy
      mineru-vlm-gateway:
        condition: service_healthy
    environment:
      PRIORITY_WORKERS: 0
    deploy:
      resources:
        reservations:
          devices: !override
            - driver: nvidia
              device_ids: ["${GPU_ID_D:-3}"]
              capabilities: [gpu]

  mineru-vlm-d:
    extends:
      file: compose.yaml
      service: mineru-vlm
    volumes:
      - vlm-cache-d:/root/.cache/vllm
    deploy:
      resources:
        reservations:
          devices: !override
            - driver: nvidia
              device_ids: ["${GPU_ID_D:-3}"]
              capabilities: [gpu]

  mineru-vlm-gateway:
    environment:
      VLM_UPSTREAMS: http://mineru-vlm:8000,http://mineru-vlm-b:8000,http://mineru-vlm-c:8000,http://mineru-vlm-d:8000
    depends_on:
      mineru-vlm-b:
        condition: service_healthy
      mineru-vlm-c:
        condition: service_healthy
      mineru-vlm-d:
        condition: service_healthy

volumes:
  vlm-cache-b:
  vlm-cache-c:
  vlm-cache-d:
