services:
  mineru-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ${API_IMAGE:-mineru-api:${SERVICE_VERSION:?Run python3 scripts/init_env.py}}
    init: true
    restart: unless-stopped
    command: ["app.main:app", "--host", "0.0.0.0", "--port", "3000", "--workers", "1", "--no-access-log"]
    ports:
      - "${API_PORT:-3888}:3000"
    env_file: &settings
      - path: ${ENV_FILE:-.env}
        required: false
    environment:
      LD_LIBRARY_PATH: /opt/sqlite/lib
      NVIDIA_VISIBLE_DEVICES: void
      QUEUE_DATABASE: /data/queue.sqlite3
      OBJECT_DIR: /data/objects
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:?Set WORKER_API_TOKEN in .env}
    volumes:
      - queue-data:/data
    stop_grace_period: 30s

  mineru-worker:
    build:
      context: .
      args:
        VLLM_IMAGE: ${VLLM_IMAGE:-vllm/vllm-openai:v0.29.0}
        SMALL_BACKEND: ${SMALL_BACKEND:-torch}
    image: ${WORKER_IMAGE:-mineru-worker:${SERVICE_VERSION:?Run python3 scripts/init_env.py}}
    init: true
    restart: unless-stopped
    depends_on:
      mineru-api:
        condition: service_healthy
      mineru-vlm-gateway:
        condition: service_healthy
    env_file: *settings
    environment:
      LD_LIBRARY_PATH: ${CUDA_LIBRARY_PATH:-/usr/local/nvidia/lib64:/usr/local/cuda/lib64:/usr/local/nvidia/lib}
      MINERU_HOME: /models
      MINERU_MODEL_SOURCE: ${MINERU_MODEL_SOURCE:-modelscope}
      MINERU_MODEL_SMALL_BACKEND: ${SMALL_BACKEND:-torch}
      MINERU_MODEL_VLM_SERVER_URL: http://mineru-vlm-gateway:8001
      MINERU_MODEL_VLM_MODEL: mineru
      WORKER_API_URL: http://mineru-api:3000
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:?Set WORKER_API_TOKEN in .env}
      MINERU_CPU_NUM_THREADS: ${MINERU_CPU_NUM_THREADS:-2}
      MINERU_MODEL_VLM_MAX_CONCURRENCY: ${MINERU_MODEL_VLM_MAX_CONCURRENCY:-8}
    volumes:
      - ${MODEL_DIR:-models}:/models
      - model-cache:/root/.cache
    shm_size: 8gb
    stop_grace_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_ID:-0}"]
              capabilities: [gpu]

  mineru-vlm-gateway:
    image: ${API_IMAGE:-mineru-api:${SERVICE_VERSION:?Run python3 scripts/init_env.py}}
    command: ["app.gateway:app", "--host", "0.0.0.0", "--port", "8001", "--no-access-log"]
    init: true
    restart: unless-stopped
    depends_on:
      mineru-vlm:
        condition: service_healthy
    # Forward only gateway settings; business/worker credentials stay out of this service.
    environment:
      NVIDIA_VISIBLE_DEVICES: void
      VLM_MAX_ACTIVE_PER_REPLICA: ${VLM_MAX_ACTIVE_PER_REPLICA:-64}
      VLM_MAX_WAITING: ${VLM_MAX_WAITING:-128}
      VLM_QUEUE_SECONDS: ${VLM_QUEUE_SECONDS:-60}
      VLM_UPSTREAMS: ${VLM_UPSTREAMS:-http://mineru-vlm:8000}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  mineru-vlm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.29.0}
    init: true
    restart: unless-stopped
    entrypoint: ["vllm", "serve"]
    command:
      - /models/models/${MODEL_REVISION:-MinerU2.5-Pro-2605-1.2B}
      - --served-model-name
      - mineru
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --gpu-memory-utilization
      - "${GPU_MEMORY_UTILIZATION:-0.35}"
      - --max-model-len
      - "8192"
    environment:
      LD_LIBRARY_PATH: ${CUDA_LIBRARY_PATH:-/usr/local/nvidia/lib64:/usr/local/cuda/lib64:/usr/local/nvidia/lib}
      VLLM_ENABLE_CUDA_COMPATIBILITY: ${VLLM_ENABLE_CUDA_COMPATIBILITY:-0}
      VLLM_WORKER_MULTIPROC_METHOD: spawn
    volumes:
      - ${MODEL_DIR:-models}:/models:ro
      - vlm-cache:/root/.cache/vllm
    shm_size: 8gb
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 20
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_ID:-0}"]
              capabilities: [gpu]

volumes:
  queue-data:
  models:
  model-cache:
  vlm-cache:
