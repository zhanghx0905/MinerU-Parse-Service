# Use with compose.yaml. PARSE_WORKERS is the process count on every GPU.
services:
  mineru-worker-b:
    extends:
      file: compose.yaml
      service: mineru-worker
    # Declare dependencies explicitly for Compose versions that omit them in extends.
    depends_on:
      mineru-api:
        condition: service_healthy
      mineru-vlm-gateway:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices: !override
            - driver: nvidia
              device_ids: ["${GPU_ID_B:-1}"]
              capabilities: [gpu]

  mineru-vlm-b:
    extends:
      file: compose.yaml
      service: mineru-vlm
    volumes:
      - vlm-cache-b:/root/.cache/vllm
    deploy:
      resources:
        reservations:
          devices: !override
            - driver: nvidia
              device_ids: ["${GPU_ID_B:-1}"]
              capabilities: [gpu]

  mineru-vlm-gateway:
    environment:
      VLM_UPSTREAMS: http://mineru-vlm:8000,http://mineru-vlm-b:8000
    depends_on:
      mineru-vlm-b:
        condition: service_healthy

volumes:
  vlm-cache-b:
